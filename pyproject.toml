[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxars"
version = "1.3.0"
description = "FX Analysis, Risk & Decision Support System (FX-ARS-SRS-ARCH-002) - MVP-1 reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "FX-ARS Technical Team" }]
dependencies = []

[project.scripts]
fxars = "fxars.cli.main:main"

[tool.setuptools.packages.find]
include = ["fxars*"]

[tool.setuptools.package-data]
fxars = ["storage/*.sql", "ui/*.html", "api/openapi.json"]
