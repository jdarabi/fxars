[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fxars"
dynamic = ["version"]
description = "FX Analysis, Risk & Decision Support System (FX-ARS-SRS-ARCH-002) - MVP-1 reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = "Proprietary"  # FIX-14-PEP639
license-files = ["LICENSE"]
authors = [{ name = "FX-ARS Technical Team" }]
dependencies = []

[project.optional-dependencies]
test = [
    "hypothesis>=6.100",
]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.8",
    "ruff>=0.5",
    "coverage>=7.4",
]
postgres = [
    "psycopg[binary]>=3.1",
]

[project.scripts]
fxars = "fxars.cli.main:main"

[tool.setuptools.packages.find]
include = ["fxars*"]


[tool.setuptools.dynamic]
version = {attr = "fxars.version.CODE_VERSION"}
[tool.setuptools.package-data]
fxars = [
    "storage/*.sql",
    "ui/*.html",
    "api/openapi.json",
]

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["fxars", "tests"]
exclude = [
    ".git",
    ".fix-backups",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "data",
    "reports",
    "reports/baseline-*",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "UP042",  # StrEnum migration is deliberate
    "E402",  # module-import-not-at-top for lazy imports
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (unavoidable in dataclasses)
    "B904",  # raise without from inside except (used intentionally)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",  # assert False (used in some tests)
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fxars.core.*", "fxars.domain.*", "fxars.risk.sizing", "fxars.risk.gate"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "fxars.api.*",
    "fxars.ui.*",
    "fxars.cli.*",
    "fxars.analysis.*",
    "fxars.research.*",
    "fxars.services.*",
    "fxars.storage.*",
    "fxars.data.*",
    "fxars.execution.*",
    "fxars.identity.*",
    "fxars.instruments.*",
    "fxars.decision.*",
    "fxars.audit.*",
    "fxars.config.*",
    "fxars.live.*",
    "fxars.tenancy.*",
    "fxars.governance.*",
    "fxars.security.*",
]
disallow_untyped_defs = false
# FIX-MYPY-V2: این لایه‌ها هنوز به‌طور کامل type-annotated نیستند.
# برای جلوگیری از ۱۳۳ خطای پر سر و صدا، فعلاً ignore_errors می‌شوند.
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "fxars.core.*",
    "fxars.domain.*",
    "fxars.risk.sizing",
    "fxars.risk.gate",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "fxars.api.*",
    "fxars.ui.*",
    "fxars.cli.*",
    "fxars.analysis.*",
    "fxars.research.*",
    "fxars.services.*",
    "fxars.storage.*",
    "fxars.data.*",
    "fxars.execution.*",
    "fxars.identity.*",
    "fxars.instruments.*",
    "fxars.decision.*",
    "fxars.audit.*",
    "fxars.config.*",
]
# Non-strict for now; tighten incrementally.
disallow_untyped_defs = false

[tool.coverage.run]
source = ["fxars"]
omit = [
    "fxars/__main__.py",
    "fxars/ui/*",
    "*/__init__.py",
    "fxars/storage/postgres.py",  # skeleton, tested only when psycopg is installed
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "raise PostgresUnavailableError",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
]

# FIX-MYPY: overrideهای موجود سخت‌گیرانه‌اند
