name: CI

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "ruff>=0.5"
      - name: Run ruff check
        run: ruff check fxars tests
        continue-on-error: true

  typecheck:
    name: Type check (mypy core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "mypy>=1.8"
      - name: Run mypy on core modules
        run: mypy fxars/core fxars/domain
        continue-on-error: true

  test:
    name: Test (Py ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[test]"
      - name: Verify import
        run: python -c "import fxars; print(fxars.CODE_VERSION)"
      - name: Run full test suite
        run: python -B -m unittest discover -s tests -v
      - name: Run acceptance tests
        run: python -B -m unittest tests.test_acceptance -v
      - name: Run property tests
        run: python -B -m unittest tests.test_property_based -v
      - name: Run HTTP integration tests
        run: python -B -m unittest tests.test_http_integration -v
      - name: Run security tests
        run: python -B -m unittest tests.test_security -v
      - name: Run regime filter tests
        run: python -B -m unittest tests.test_regime_filter -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: coverage run --source=fxars -m unittest discover -s tests
      - name: Coverage report
        run: coverage report --fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .
      - name: Init database
        run: python -m fxars init --no-users
      - name: Seed demo data
        run: python -m fxars seed-demo
      - name: Run analysis
        run: python -m fxars analyze --instrument EURUSD --timeframe H1
      - name: Run backtest
        run: python -m fxars backtest --instrument EURUSD --timeframe H1
      - name: Audit verify
        run: python -m fxars audit verify
      - name: Regime benchmark
        run: python scripts/benchmark_regime.py
      - name: Smoke regime filter
        run: python scripts/smoke_regime_filter.py
