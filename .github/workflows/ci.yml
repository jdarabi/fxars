name: CI

on:
  push:
    branches: [ main, fix/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - run: ruff check fxars tests

  typecheck:
    name: Type check (mypy, strict on core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "mypy>=1.8"
      - run: mypy fxars/core fxars/domain
        continue-on-error: true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - name: Run test suite
        run: python -B -m unittest discover -s tests -v
      - name: Run property tests only
        run: python -B -m unittest tests.test_property_based -v
      - name: Run HTTP integration tests
        run: python -B -m unittest tests.test_http_integration -v
      - name: Run acceptance tests
        run: python -B -m unittest tests.test_acceptance -v

  coverage:
    name: Coverage (fail under 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: coverage run --source=fxars -m unittest discover -s tests
      - run: coverage report --fail-under=80

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Generate demo data
        run: python -m fxars init --no-users
      - name: Seed demo
        run: python -m fxars seed-demo
      - name: Run analysis benchmark
        run: python scripts/benchmark.py